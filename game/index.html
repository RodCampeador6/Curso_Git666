<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Run</title>
<style>
  :root { --bg:#0b0d17; --fg:#e8e6f0; --accent:#ffb347; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:12px; left:16px; right:16px; display:flex;
    justify-content:space-between; font-weight:600; pointer-events:none; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:16px;
    background:rgba(11,13,23,.82); }
  #overlay h1 { color:var(--accent); margin:0 0 8px; font-size:clamp(32px,8vw,56px); }
  #overlay p { max-width:420px; line-height:1.5; margin:6px 0; }
  #overlay button { margin-top:16px; font:inherit; font-weight:700; padding:12px 28px;
    border:0; border-radius:8px; background:var(--accent); color:#1a1205; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">Score 0</span><span id="dash">Dash ready</span><span id="best">Best 0</span></div>
<div id="overlay">
  <h1>Lantern Run</h1>
  <p id="msg">Collect the embers to keep your lantern alive. Ghosts multiply and fear only your dash.</p>
  <p><b>Move:</b> WASD / arrows, or drag on touch.<br><b>Dash:</b> Space, or double-tap. Dashing through a ghost banishes it.</p>
  <button id="start">Play</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  let best = 0;
  try { best = +localStorage.getItem('lanternBest') || 0; } catch (e) {}
  $('best').textContent = 'Best ' + best;

  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); tryDash(); }
  });
  addEventListener('keyup', e => keys[e.code] = false);

  let touchTarget = null, lastTap = 0;
  cv.addEventListener('pointerdown', e => {
    const now = performance.now();
    if (now - lastTap < 280) tryDash();
    lastTap = now;
    touchTarget = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', e => { if (touchTarget) touchTarget = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointerup', () => touchTarget = null);

  let state, running = false, last = 0;

  function reset() {
    state = {
      p: { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 12 },
      light: 1, score: 0, t: 0,
      dashT: 0, dashCd: 0,
      embers: [], ghosts: [], parts: [],
      spawnT: 3
    };
    for (let i = 0; i < 3; i++) spawnEmber();
    spawnGhost();
  }

  function spawnEmber() {
    const m = 40;
    state.embers.push({ x: m + Math.random() * (W - 2 * m), y: m + Math.random() * (H - 2 * m), ph: Math.random() * 6 });
  }

  function spawnGhost() {
    const p = state.p; let x, y;
    do {
      const side = Math.random() * 4 | 0;
      x = side === 0 ? -20 : side === 1 ? W + 20 : Math.random() * W;
      y = side === 2 ? -20 : side === 3 ? H + 20 : Math.random() * H;
      if (side < 2) y = Math.random() * H;
    } while (Math.hypot(x - p.x, y - p.y) < 200);
    state.ghosts.push({ x, y, r: 14, sp: 55 + Math.random() * 30 + state.t * 1.5, ph: Math.random() * 6 });
  }

  function tryDash() {
    if (!running || state.dashCd > 0) return;
    const p = state.p;
    let dx = p.vx, dy = p.vy, l = Math.hypot(dx, dy);
    if (l < 1) return;
    p.vx = dx / l * 900; p.vy = dy / l * 900;
    state.dashT = 0.18; state.dashCd = 1.6;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = 60 + Math.random() * 180;
      state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function update(dt) {
    const s = state, p = s.p;
    s.t += dt;
    s.dashT = Math.max(0, s.dashT - dt);
    s.dashCd = Math.max(0, s.dashCd - dt);

    let ax = 0, ay = 0;
    if (keys.KeyA || keys.ArrowLeft) ax--;
    if (keys.KeyD || keys.ArrowRight) ax++;
    if (keys.KeyW || keys.ArrowUp) ay--;
    if (keys.KeyS || keys.ArrowDown) ay++;
    if (touchTarget) {
      const dx = touchTarget.x - p.x, dy = touchTarget.y - p.y, l = Math.hypot(dx, dy);
      if (l > 8) { ax = dx / l; ay = dy / l; }
    }
    const al = Math.hypot(ax, ay) || 1;
    if (s.dashT === 0) {
      const speed = 260;
      p.vx += (ax / al * speed - p.vx) * Math.min(1, dt * 10);
      p.vy += (ay / al * speed - p.vy) * Math.min(1, dt * 10);
    }
    p.x = Math.max(p.r, Math.min(W - p.r, p.x + p.vx * dt));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y + p.vy * dt));

    // Lantern burns down faster over time
    s.light -= dt * (0.07 + s.t * 0.0012);

    for (let i = s.embers.length - 1; i >= 0; i--) {
      const e = s.embers[i];
      if (Math.hypot(e.x - p.x, e.y - p.y) < p.r + 10) {
        s.embers.splice(i, 1);
        s.light = Math.min(1, s.light + 0.22);
        s.score += 10;
        burst(e.x, e.y, '#ffb347', 12);
        spawnEmber();
      }
    }

    s.spawnT -= dt;
    if (s.spawnT <= 0) { spawnGhost(); s.spawnT = Math.max(1.5, 6 - s.t * 0.05); }

    // Darker lantern = ghosts get bolder
    const bold = 1 + (1 - s.light) * 0.8;
    for (let i = s.ghosts.length - 1; i >= 0; i--) {
      const g = s.ghosts[i];
      const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy) || 1;
      g.x += dx / d * g.sp * bold * dt + Math.sin(s.t * 2 + g.ph) * 20 * dt;
      g.y += dy / d * g.sp * bold * dt + Math.cos(s.t * 2 + g.ph) * 20 * dt;
      if (d < p.r + g.r) {
        if (s.dashT > 0) {
          s.ghosts.splice(i, 1);
          s.score += 25;
          burst(g.x, g.y, '#b9c3ff', 20);
        } else return gameOver('A ghost caught you.');
      }
    }

    for (let i = s.parts.length - 1; i >= 0; i--) {
      const q = s.parts[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt;
      if (q.life <= 0) s.parts.splice(i, 1);
    }

    if (s.light <= 0) return gameOver('Your lantern went out.');
    s.score += dt * 2;
  }

  function draw() {
    const s = state, p = s.p;
    ctx.fillStyle = '#0b0d17'; ctx.fillRect(0, 0, W, H);

    const rad = 70 + s.light * 260;
    const g = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, rad);
    g.addColorStop(0, 'rgba(255,190,110,0.35)');
    g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const e of s.embers) {
      const pulse = 6 + Math.sin(s.t * 5 + e.ph) * 2;
      ctx.fillStyle = '#ffb347'; ctx.shadowColor = '#ff8c1a'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(e.x, e.y, pulse, 0, 6.283); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const gh of s.ghosts) {
      const d = Math.hypot(gh.x - p.x, gh.y - p.y);
      const vis = Math.max(0.12, Math.min(0.9, 1 - (d - rad * 0.6) / rad));
      ctx.globalAlpha = vis;
      ctx.fillStyle = '#c9d1ff';
      const y = gh.y + Math.sin(s.t * 4 + gh.ph) * 2;
      ctx.beginPath();
      ctx.arc(gh.x, y - 2, gh.r, Math.PI, 0);
      ctx.lineTo(gh.x + gh.r, y + gh.r);
      for (let k = 3; k >= 0; k--) ctx.lineTo(gh.x - gh.r + k * (gh.r * 2 / 3) - gh.r / 3, y + gh.r - (k % 2 ? 5 : 0));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0b0d17';
      ctx.beginPath(); ctx.arc(gh.x - 5, y - 3, 2.5, 0, 6.283); ctx.arc(gh.x + 5, y - 3, 2.5, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const q of s.parts) {
      ctx.globalAlpha = q.life / 0.6; ctx.fillStyle = q.color;
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = s.dashT > 0 ? '#ffffff' : '#ffd08a';
    ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 20 * s.light + 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;

    // Light meter
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(16, H - 24, Math.min(240, W - 32), 8);
    ctx.fillStyle = s.light > 0.3 ? '#ffb347' : '#ff5a4a';
    ctx.fillRect(16, H - 24, Math.min(240, W - 32) * Math.max(0, s.light), 8);

    $('score').textContent = 'Score ' + (s.score | 0);
    $('dash').textContent = s.dashCd > 0 ? 'Dash ' + s.dashCd.toFixed(1) + 's' : 'Dash ready';
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.033, (t - last) / 1000); last = t;
    update(dt);
    if (running) draw();
    requestAnimationFrame(loop);
  }

  function gameOver(why) {
    running = false;
    const sc = state.score | 0;
    if (sc > best) { best = sc; try { localStorage.setItem('lanternBest', best); } catch (e) {} }
    $('best').textContent = 'Best ' + best;
    $('msg').textContent = why + ' Score: ' + sc + '.';
    $('start').textContent = 'Play again';
    $('overlay').classList.remove('hidden');
  }

  $('start').addEventListener('click', () => {
    $('overlay').classList.add('hidden');
    reset(); running = true; last = performance.now();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
